# GenIce3 configuration file example (YAML).
# Command-line options override values from this file.
#
# See also: docs/cli.md (Config file) and examples/api/*/*.yaml

genice3:
  seed: 42
  pol_loop_1: 2000
  replication_factors: [2, 2, 2]
  debug: false

unitcell:
  name: "1h"
  # Fractional shift of the unit cell origin
  shift: [0.1, 0.1, 0.1]

# Exporter: string name, {plugin: {options}}, or {name: plugin, ...options}
exporter:
  name: "gromacs"
  water_model: tip4p

# Guests and spot ions are GenIce3-level keys (not exporter options)
# guest:
#   A12: me
# spot_anion:
#   "1": Cl
# spot_cation:
#   "0": Na
